<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join IronPulse Fitness</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Navigation Bar -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-dumbbell"></i></div>
        <span class="logo-text">IronPulse</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="contact.html" class="active">Join Now</a></li>
      </ul>
      <a href="contact.html" class="nav-cta">Free Pass</a>
    </div>
  </header>

  <!-- Contact Section -->
  <section class="container" style="padding-top: 5rem; max-width: 800px;">
    <div class="section-header">
      <div class="badge-tag"><i class="fa-solid fa-id-card"></i> Membership Application</div>
      <h2>Claim Your Free Day Pass</h2>
      <p>Fill out the form below to start your fitness journey with IronPulse Fitness.</p>
    </div>

    <div class="card" style="padding: 3rem;">
      <form id="membershipForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div>
          <label style="display: block; font-size: 0.85rem; font-family: monospace; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Full Name</label>
          <input type="text" id="fullName" required placeholder="e.g. John Doe" style="width: 100%; padding: 0.85rem 1rem; background: rgba(10, 10, 12, 0.9); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;">
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-family: monospace; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Email Address</label>
          <input type="email" id="email" required placeholder="john@athlete.io" style="width: 100%; padding: 0.85rem 1rem; background: rgba(10, 10, 12, 0.9); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;">
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-family: monospace; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Select Plan / Interest</label>
          <select id="planSelect" style="width: 100%; padding: 0.85rem 1rem; background: rgba(10, 10, 12, 0.9); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;">
            <option value="Free Day Pass">Free 1-Day Trial Pass</option>
            <option value="Monthly Elite">Monthly Elite Membership</option>
            <option value="Annual VIP">Annual VIP All-Access</option>
          </select>
        </div>

        <button type="submit" class="btn-primary" style="justify-content: center; width: 100%; cursor: pointer; border: none;">
          Submit Application <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
      <div class="logo-icon" style="width: 32px; height: 32px; font-size: 0.9rem;"><i class="fa-solid fa-dumbbell"></i></div>
      <span class="logo-text" style="font-size: 1.1rem;">IronPulse</span>
    </div>
    <p>&copy; 2026 IronPulse Fitness. All Rights Reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
